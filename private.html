<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盤前十分鐘</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<style>
:root{--bg:#EAECEF;--card:#fff;--ink:#15181D;--ink2:#39404E;--line:#D6DAE1;
  --accent:#1D5E59;--fail:#A53A20}
@media (prefers-color-scheme:dark){:root{--bg:#0E1013;--card:#171A20;
  --ink:#E9EBEF;--ink2:#C0C7D4;--line:#2A2F39;--accent:#5CCFC0;--fail:#E08B6E}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;background:var(--bg);color:var(--ink);padding:20px;
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:26px 24px;width:100%;max-width:360px;
  box-shadow:0 1px 2px rgba(20,24,32,.06),0 10px 30px -18px rgba(20,24,32,.3)}
h1{font-size:20px;margin:0 0 4px}
p.sub{font-size:13px;color:var(--ink2);margin:0 0 18px;line-height:1.5}
label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
input{width:100%;padding:13px 14px;font-size:16px;border-radius:9px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  -webkit-appearance:none}
input:focus{outline:2px solid var(--accent);outline-offset:1px;
  border-color:transparent}
button{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:600;
  border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.row{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12.5px;
  color:var(--ink2)}
.row input{width:auto;padding:0;margin:0}
.msg{margin-top:12px;font-size:13px;min-height:19px}
.msg.err{color:var(--fail)}
.foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink2);line-height:1.55}
</style></head><body>
<div class="box">
  <h1>盤前十分鐘</h1>
  <p class="sub">私人版．資料日 2026-09-03<br>內容已加密，請輸入密碼。</p>
  <form id="f">
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password"
           enterkeyhint="go" autofocus>
    <div class="row"><input id="rm" type="checkbox">
      <label for="rm" style="margin:0">在這台裝置記住 7 天</label></div>
    <button id="go" type="submit">解鎖</button>
  </form>
  <div class="msg" id="msg"></div>
  <p class="foot">含門檻數值、關卡邏輯與推薦評分，不要外流。
    解密在你的瀏覽器裡完成，密碼不會送到任何伺服器。</p>
</div>

}

async function unlock(pw, quiet){
  var msg = document.getElementById("msg");
  msg.className = "msg";
  msg.textContent = quiet ? "自動解鎖中…" : "解密中…";
  try {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey(
      "raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
    var html = new TextDecoder().decode(plain);
    if (document.getElementById("rm").checked) {
      try { localStorage.setItem(KEY, JSON.stringify(
        {pw: pw, exp: Date.now() + 7*864e5})); } catch (e) {}
    }
    // document.write 才會讓解出來的 <script> 真的執行
    document.open(); document.write(html); document.close();
  } catch (e) {
    // AES-GCM 的驗證標籤過不了就是密碼錯 —— 不必再自己比對雜湊
    try { localStorage.removeItem(KEY); } catch (e2) {}
    msg.className = "msg err";
    msg.textContent = quiet ? "記住的密碼已失效，請重新輸入。" : "密碼錯誤。";
    document.getElementById("pw").value = "";
    document.getElementById("pw").focus();
  }
}

document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var pw = document.getElementById("pw").value;
  if (pw) unlock(pw, false);
});

// 記住的密碼：過期就丟掉，不要無限期留著
(function(){
  try {
    var v = JSON.parse(localStorage.getItem(KEY) || "null");
    if (v && v.pw && v.exp > Date.now()) {
      document.getElementById("rm").checked = true;
      unlock(v.pw, true);
    } else if (v) {
      localStorage.removeItem(KEY);
    }
  } catch (e) {}
})();
</script></body></html>
