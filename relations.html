<style>
:root{
  --bg:#f7f6f3; --card:#fffefb; --line:#e2ded4; --fg:#22201c; --dim:#6f6a60;
  --ink:#0f0e0c; --acc:#b4532a; --acc2:#2f6f6a; --gold:#c8952a;
  --sup:#2f6f6a; --cmp:#b4532a; --thm:#5b5aa6; --oth:#7a7468;
  --chip:#efece4; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151a; --card:#1e1d23; --line:#33313b; --fg:#e9e6df; --dim:#a09a90;
    --ink:#f6f4ef; --acc:#e0784a; --acc2:#5fb3ab; --gold:#e0b45c;
    --sup:#5fb3ab; --cmp:#e0784a; --thm:#9a99e0; --oth:#9b948a;
    --chip:#2a2932; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16151a; --card:#1e1d23; --line:#33313b; --fg:#e9e6df; --dim:#a09a90;
  --ink:#f6f4ef; --acc:#e0784a; --acc2:#5fb3ab; --gold:#e0b45c;
  --sup:#5fb3ab; --cmp:#e0784a; --thm:#9a99e0; --oth:#9b948a;
  --chip:#2a2932; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin-bottom:4px}
h1{font-size:24px;margin:0;letter-spacing:.02em;color:var(--ink)}
.sub{color:var(--dim);font-size:13px}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.stat b{background:var(--chip);border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;font-weight:600;font-size:12px;color:var(--fg)}
.stat b i{font-style:normal;color:var(--dim);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input[type=search],select{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
input[type=search]{flex:1 1 240px;max-width:340px}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.tog input{accent-color:var(--acc);margin:0}
.panes{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media(max-width:900px){.panes{grid-template-columns:minmax(0,1fr)}}
.board{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:640px;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;
  font-size:11px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.hint{position:absolute;right:10px;top:10px;font-size:11px;color:var(--dim);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 13px;box-shadow:var(--shadow);max-height:660px;overflow:auto}
.side h2{margin:0 0 2px;font-size:17px;color:var(--ink)}
.side .meta{font-size:12px;color:var(--dim);margin-bottom:10px}
.rel{border-top:1px solid var(--line);padding:8px 0}
.rel:first-of-type{border-top:0}
.rel .h{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rel .k{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff}
.k.sup{background:var(--sup)}.k.cmp{background:var(--cmp)}.k.thm{background:var(--thm)}
.k.oth{background:var(--oth)}
.rel .t{font-weight:600;color:var(--ink)}
.rel .q{font-size:12px;color:var(--dim);margin-top:3px}
.nums{font-size:12px;margin-top:3px;color:var(--dim);font-variant-numeric:tabular-nums}
.nums b{color:var(--ink);font-weight:700}
.nums i{font-style:normal;font-weight:700;color:var(--fg)}
.nums i.m{color:var(--dim);font-weight:500}
.nums i.hot{color:var(--cmp)}
.nums i.warm{color:var(--gold)}
.nums i.o{color:var(--cmp)}
.nums i.x{color:var(--sup)}
.nums i.yj{color:var(--gold);font-weight:700}
.rel .s{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl{margin-top:18px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tbl h3{margin:0;padding:10px 13px;font-size:14px;border-bottom:1px solid var(--line);color:var(--ink)}
.scroll{overflow-x:auto;max-height:460px;overflow-y:auto}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11px;color:var(--dim);
  font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--chip)}
td.n{white-space:nowrap;font-weight:600;color:var(--ink);cursor:pointer}
td.q{color:var(--dim);min-width:260px}
.foot{margin-top:16px;font-size:12px;color:var(--dim)}
.foot a{color:var(--acc)}
.empty{color:var(--dim);font-size:13px;padding:8px 0}
.verd{margin:0 0 14px}
.verd .vh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.verd .vh h2{font-size:16px;margin:0;color:var(--ink)}
.verd .vh span{font-size:12px;color:var(--dim)}
.vcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.vcard summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.vcard summary::-webkit-details-marker{display:none}
.vcard .tt{font-weight:700;color:var(--ink);font-size:14px}
.vcard .cf{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;background:var(--sup)}
.vcard .cf.mid{background:var(--gold)}.vcard .cf.low{background:var(--oth)}
.vcard .vd{font-size:12.5px;color:var(--fg);margin-top:2px;flex:1 1 100%}
.vcard .side2{margin-top:8px;font-size:12.5px;line-height:1.6}
.vcard .side2 b{color:var(--dim);font-weight:600}
.vcard .ans{margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--chip);
  font-size:13px;color:var(--ink);font-weight:600}
.vcard .why{margin-top:6px;font-size:12.5px;color:var(--dim);line-height:1.65}
</style>

  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  var N = REL.nodes || [], E = REL.edges || [];
  var byId = {}; N.forEach(function(n){ byId[n.id] = n; });
  E = E.filter(function(e){ return byId[e.s] && byId[e.o]; });

  // 有報告佐證的節點（用來做「只看有報告佐證」那個開關）
  var hasRep = {};
  E.forEach(function(e){ if(e.L === "報告"){ hasRep[e.s] = 1; hasRep[e.o] = 1; } });

  var COL = {供應給:"sup", 採購自:"sup", 代理:"sup", 合作:"sup", 認證中:"sup",
             競爭:"cmp", 屬於題材:"thm", 受惠於:"thm"};
  function kcls(r){ return COL[r] || "oth"; }
  // 每種關係從「主體端」與「對象端」看各自怎麼講。↑ 是往上游、↓ 是往下游。
  var VERB = {
    供應給:  {out:["下游客戶","↓"], in:["上游供應商","↑"]},
    採購自:  {out:["上游供應商","↑"], in:["下游客戶","↓"]},
    代理:    {out:["代理銷售","↓"], in:["由其代理","↑"]},
    認證中:  {out:["認證中的客戶","↓"], in:["認證中的供應商","↑"]},
    競爭:    {out:["同業競爭","↔"], in:["同業競爭","↔"]},
    合作:    {out:["合作","↔"], in:["合作","↔"]},
    屬於題材:{out:["所屬題材","⊂"], in:["題材成員","∋"]},
    受惠於:  {out:["受惠於","⤴"], in:["帶動","⤵"]},
    受制於:  {out:["受制於","⚠"], in:["影響到","⚠"]},
    對應美股:{out:["對標美股","≈"], in:["台股對應","≈"]}
  };
  function css(v){ return getComputedStyle(document.documentElement)
                     .getPropertyValue(v).trim() || "#888"; }

  // ── 統計列 ───────────────────────────────────────────
  var S = REL.stats || {};
  document.getElementById("stat").innerHTML =
    [["關聯", (S["報告關聯"]||0) + (S["產業鏈關聯"]||0) + " 條"],
     ["其中報告佐證", (S["報告關聯"]||0) + " 條"],
     ["出處", (S["報告份數"]||0) + " 份"],
     ["節點", N.length + " 個"],
     ["個股", N.filter(function(n){return n.t==="個股";}).length + " 檔"],
     ["更新", REL.built || "—"]]
    .map(function(x){ return "<b><i>" + x[0] + "</i> " + x[1] + "</b>"; }).join("");

  var kinds = {};
  E.forEach(function(e){ kinds[e.r] = (kinds[e.r]||0) + 1; });
  var rk = document.getElementById("rk");
  Object.keys(kinds).sort(function(a,b){ return kinds[b]-kinds[a]; })
    .forEach(function(k){
      var o = document.createElement("option");
      o.value = k; o.textContent = k + "（" + kinds[k] + "）"; rk.appendChild(o);
    });

  document.getElementById("lg").innerHTML =
    [["個股","--acc"],["題材","--thm"],["客群／外商／產品","--oth"]]
      .map(function(x){ return "<span><i style='background:"+css(x[1])+"'></i>"+x[0]+"</span>"; })
      .join("") +
    "<span>↑ 上游供應商　↓ 下游客戶　↔ 同業　⊂ 所屬題材</span>" +
    "<span>連線顏色：<i style='background:"+css("--sup")+"'></i>供應鏈"+
    "<i style='background:"+css("--cmp")+"'></i>競爭"+
    "<i style='background:"+css("--thm")+"'></i>題材</span>";

  // ── 說法分歧與判讀 ──────────────────────────────────
  //   使用者 2026-09-09：「最重要的是彙整及辨別哪個說詞是對的」。
  //   放在圖的上面 —— 這是進來要先看的，不是附註。
  (function(){
    var V = REL.verdicts || [], box = document.getElementById("verd");
    if(!V.length){ box.style.display = "none"; return; }
    var cf = {"高":"", "中":"mid", "低":"low"};
    box.innerHTML = "<div class='vh'><h2>⚖ 說法分歧與判讀</h2>" +
      "<span>" + V.length + " 條 —— 同一件事不同報告講法不一樣時，記下我判哪一邊、理由是什麼。" +
      "判讀是判斷不是事實，理由都寫得可以被反駁。</span></div>" +
      V.map(function(v){
        return "<details class='vcard'><summary>" +
          "<span class='cf " + (cf[v.信心] || "") + "'>信心" + esc(v.信心) + "</span>" +
          "<span class='tt'>" + esc(v.主題) + (v.代號 ? "（" + esc(v.代號) + "）" : "") + "</span>" +
          "<span class='vd'>" + esc(v.分歧點) + "</span></summary>" +
          "<div class='side2'><b>說法 A｜</b>" + esc(v.說法A) + "<br>" +
          "<b>說法 B｜</b>" + esc(v.說法B) + "</div>" +
          "<div class='ans'>⚖ 判讀：" + esc(v.判讀) + "</div>" +
          "<div class='why'>" + esc(v.理由) + "</div></details>";
      }).join("");
  })();

  // ── 版面配置（力導向，跑固定回合數後定住）─────────────
  var W = 900, H = 640, cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var pos = {};
  N.forEach(function(n, i){
    var a = i * 2.399963, r = 20 + 15 * Math.sqrt(i);   // 黃金角撒點，起始不重疊
    pos[n.id] = {x: Math.cos(a)*r, y: Math.sin(a)*r, vx:0, vy:0};
  });
  var adj = {};
  E.forEach(function(e){
    (adj[e.s] = adj[e.s] || []).push(e);
    (adj[e.o] = adj[e.o] || []).push(e);
  });
  function layout(rounds){
    var ids = N.map(function(n){ return n.id; });
    for(var it=0; it<rounds; it++){
      var k = 1 - it/rounds;                       // 退火：越後面動得越少
      for(var i=0;i<ids.length;i++){
        var a = pos[ids[i]];
        for(var j=i+1;j<ids.length;j++){
          var b = pos[ids[j]], dx = a.x-b.x, dy = a.y-b.y;
          var d2 = dx*dx + dy*dy || .01;
          if(d2 > 90000) continue;                 // 太遠的不互推，省一半時間
          var f = 900 / d2;
          var d = Math.sqrt(d2);
          a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
        }
      }
      E.forEach(function(e){
        var a = pos[e.s], b = pos[e.o], dx = b.x-a.x, dy = b.y-a.y;
        var d = Math.sqrt(dx*dx+dy*dy) || .01, f = (d - 70) * .012;
        a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
      });
      ids.forEach(function(id){
        var p = pos[id];
        p.vx -= p.x * .0025; p.vy -= p.y * .0025;   // 往中心收，避免飄散
        p.x += p.vx * k; p.y += p.vy * k;
        p.vx *= .82; p.vy *= .82;
      });
    }
  }
  layout(260);

  var view = {x:0, y:0, s:1}, sel = null, dim = false, hot = null, filt = "";
  function radius(n){ return 4 + Math.min(9, Math.sqrt(n.deg) * 2.2); }
  function nodeColor(n){
    return n.t === "個股" ? css("--acc") : n.t === "題材" ? css("--thm") : css("--oth");
  }
  function visibleEdge(e){
    if(e.L === "報告" && !document.getElementById("L1").checked) return false;
    if(e.L === "產業鏈" && !document.getElementById("L2").checked) return false;
    if(rk.value && e.r !== rk.value) return false;
    if(document.getElementById("iso").checked && e.L !== "報告") return false;
    return true;
  }
  function match(n){
    if(!filt) return false;
    return (n.n + " " + (n.code||"") + " " + (n.th||"")).toLowerCase()
             .indexOf(filt) >= 0;
  }

  function fit(){
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function T(p){ return {x: p.x*view.s + view.x + W/2, y: p.y*view.s + view.y + H/2}; }

  function draw(){
    ctx.clearRect(0,0,W,H);
    var vis = E.filter(visibleEdge);
    var live = {};
    vis.forEach(function(e){ live[e.s]=1; live[e.o]=1; });
    // ⚠ 只有「使用者主動點了節點」才把其他人淡掉。一進來就淡掉的話，
    //   整張圖看起來像沒載入（2026-09-08 使用者回報「怎麼按都沒資料」的第二層問題）。
    var near = null;
    if(sel && dim){
      near = {}; near[sel] = 1;
      (adj[sel]||[]).forEach(function(e){
        if(visibleEdge(e)){ near[e.s]=1; near[e.o]=1; } });
    }

    vis.forEach(function(e){
      var a = T(pos[e.s]), b = T(pos[e.o]);
      var on = !near || (near[e.s] && near[e.o]);
      ctx.strokeStyle = css("--" + ({sup:"sup",cmp:"cmp",thm:"thm",oth:"oth"}[kcls(e.r)]));
      ctx.globalAlpha = on ? (e.L === "報告" ? .8 : .32) : .07;
      ctx.lineWidth = (e.L === "報告" ? 1.4 : .8) * (on ? 1.4 : 1);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    N.forEach(function(n){
      if(!live[n.id]) return;
      var p = T(pos[n.id]), r = radius(n) * Math.min(1.6, view.s);
      var on = !near || near[n.id], hit = match(n);
      ctx.globalAlpha = on ? 1 : .13;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832);
      ctx.fillStyle = nodeColor(n); ctx.fill();
      if(hit || n.id === sel || n.id === hot){
        ctx.lineWidth = 2.5; ctx.strokeStyle = css("--gold"); ctx.stroke();
      }
      // 有選取時：選中的與它的鄰居一律標名字（那才是要看的東西）；
      // 沒選取時才退回「只標連結多的」，否則 369 個節點會糊成一片。
      var big = (near ? near[n.id] : (n.deg >= 4 || view.s > 1.3))
                || hit || n.id === sel;
      if(big && on){
        ctx.font = "600 " + Math.min(13, 10 + view.s) + "px system-ui,sans-serif";
        ctx.textAlign = "center";
        // 先用底色描邊再填字 —— 名字常常壓在連線上，沒描邊會讀不出來
        ctx.lineWidth = 3; ctx.strokeStyle = css("--card");
        ctx.strokeText(n.n, p.x, p.y - r - 4);
        ctx.fillStyle = css("--fg");
        ctx.fillText(n.n, p.x, p.y - r - 4);
      }
      ctx.globalAlpha = 1;
    });
  }

  function pick(mx,my){
    var best = null, bd = 16*16;
    N.forEach(function(n){
      var p = T(pos[n.id]), dx = p.x-mx, dy = p.y-my, d = dx*dx+dy*dy;
      if(d < bd){ bd = d; best = n; }
    });
    return best;
  }

  // ── 右側細節 ────────────────────────────────────────

  function n1(v){ return v == null ? "—" : (Math.round(v*10)/10); }
  // 個股的一行數值：收盤、1M/3M/6M 動能位階、60分K。
  // 動能 >=90 標紅、>=70 標琥珀；60分K 的 O 是紅、X 是綠（跟主頁同一套讀法）。
  function nums(n){
    if(n.t !== "個股") return "";
    var out = [];
    if(n.close != null) out.push("<b>收 " + n1(n.close) + "</b>");
    else out.push("<i class='m'>不在今天的流動性池（無價量）</i>");
    var m = [n.p1, n.p3, n.p6].map(function(v){
      if(v == null) return "<i class='m'>—</i>";
      var c = v >= 90 ? "hot" : v >= 70 ? "warm" : "";
      return "<i class='m " + c + "'>" + Math.round(v) + "</i>";
    }).join("/");
    out.push("動能 " + m);
    if(n.ox){
      out.push("60分K " + String(n.ox).split("").map(function(ch){
        return ch === "O" ? "<i class='o'>O</i>"
             : ch === "X" ? "<i class='x'>X</i>" : "<i class='m'>-</i>";
      }).join(""));
    }
    // 主力推薦（使用者 2026-09-09 追加）：看多人數與加權分，重量級的標出來。
    if(n.long){
      out.push("<i class='yj'>😀 " + n.long + " 人看多" +
        (n.w != null && n.w !== n.long ? "（加權 " + n1(n.w) + "）" : "") +
        (n.heavy ? "・重量級 " + esc(n.heavy) : "") + "</i>");
    }
    return "<div class='nums'>" + out.join("　") + "</div>";
  }
  function show(id, opt){
    opt = opt || {};
    sel = id; dim = !opt.nodim;
    var n = byId[id], box = document.getElementById("side");
    if(opt.center && pos[id]){          // 搜尋命中時把它移到畫面中央
      view.x = -pos[id].x * view.s; view.y = -pos[id].y * view.s;
    }
    if(!n){ box.innerHTML = "<div class='empty'>點圖上的節點，或用上面的搜尋框。</div>";
            draw(); return; }
    var meta = [];
    if(n.t === "個股"){
      if(n.code) meta.push(n.code);
      if(n.close != null) meta.push("收盤 " + n.close);
      if(n.p1 != null) meta.push("1M 動能 " + Math.round(n.p1));
      if(n.th) meta.push("代表題材：" + n.th);
      if(n.thsrc) meta.push(n.thsrc);
    } else { meta.push(n.t); }
    var es = (adj[id]||[]).filter(visibleEdge);
    var html = "<h2>" + esc(n.n) + "</h2><div class='meta'>" +
      esc(meta.join("　·　")) + "</div>" + nums(n);
    if(!es.length) html += "<div class='empty'>這個圖層下沒有關聯。</div>";
    es.sort(function(a,b){ return (b.L==="報告") - (a.L==="報告") || b.w - a.w; });
    es.forEach(function(e){
      var out = e.s === id, other = byId[out ? e.o : e.s];
      // ⚠ 使用者 2026-09-08：「上游下游的關係應該標註(上游)(下游)，我比較容易看」。
      //   同一條邊從兩端看是相反的：A 供應給 B，在 A 的頁面上 B 是「下游客戶」，
      //   在 B 的頁面上 A 是「上游供應商」。所以正反兩個方向各給一組講法。
      var v = (VERB[e.r] || {})[out ? "out" : "in"] ||
              [(out ? "" : "被") + e.r, "·"];
      var verb = v[1] + " " + v[0];
      html += "<div class='rel'><div class='h'>" +
        "<span class='k " + kcls(e.r) + "'>" + esc(verb) + "</span>" +
        "<span class='t' data-go='" + esc(other.id) + "'>" + esc(other.n) + "</span>" +
        (e.L === "報告" ? "<span class='tag'>" + esc(e.ev || "報告") + "</span>" : "") +
        "</div>";
      html += nums(other);
      if(e.q) html += "<div class='q'>" + esc(e.q) + "</div>";
      if(e.src || e.d) html += "<div class='s'>" + esc([e.d, e.src].filter(Boolean).join("　")) + "</div>";
      if(e.note) html += "<div class='s'>" + esc(e.note) + "</div>";
      html += "</div>";
    });
    box.innerHTML = html;
    box.scrollTop = 0;
    draw();
  }
  document.getElementById("side").addEventListener("click", function(ev){
    var t = ev.target.closest("[data-go]");
    if(t) show(t.getAttribute("data-go"));
  });

  // ── 明細表 ─────────────────────────────────────────
  function table(){
    var rows = E.filter(visibleEdge).filter(function(e){
      if(!filt) return true;
      var s = byId[e.s], o = byId[e.o];
      return (s.n + s.code + o.n + (o.code||"") + e.r + e.q + e.src)
               .toLowerCase().indexOf(filt) >= 0;
    });
    rows.sort(function(a,b){ return (b.L==="報告")-(a.L==="報告") ||
      String(b.d).localeCompare(String(a.d)) || b.w - a.w; });
    var h = "<thead><tr><th>日期</th><th>主體</th><th>關係</th><th>對象</th>" +
            "<th>證據</th><th>出處</th><th>原文摘要</th></tr></thead><tbody>";
    rows.slice(0, 400).forEach(function(e){
      var s = byId[e.s], o = byId[e.o];
      h += "<tr><td>" + esc(e.d || "—") + "</td>" +
        "<td class='n' data-go='" + esc(s.id) + "'>" + esc(s.n) + "</td>" +
        "<td><span class='k " + kcls(e.r) + "'>" +
          esc(((VERB[e.r]||{}).out ? VERB[e.r].out[1] + " " + VERB[e.r].out[0] : e.r)) +
          "</span></td>" +
        "<td class='n' data-go='" + esc(o.id) + "'>" + esc(o.n) + "</td>" +
        "<td>" + esc(e.ev) + "</td><td>" + esc(e.src) + "</td>" +
        "<td class='q'>" + esc(e.q) + "</td></tr>";
    });
    h += "</tbody>";
    document.getElementById("tb").innerHTML = h;
    document.getElementById("foot").textContent =
      "顯示 " + Math.min(400, rows.length) + " / " + rows.length + " 條關聯" +
      (rows.length > 400 ? "（用搜尋縮小範圍看更多）" : "") +
      "　資料來源：relations.csv（每份報告手動抽出、附出處與原文）";
  }
  document.getElementById("tb").addEventListener("click", function(ev){
    var t = ev.target.closest("[data-go]");
    if(t) show(t.getAttribute("data-go"));
  });

  // ── 互動 ───────────────────────────────────────────
  var drag = null;
  cv.addEventListener("pointerdown", function(ev){
    var r = cv.getBoundingClientRect(), mx = ev.clientX-r.left, my = ev.clientY-r.top;
    var n = pick(mx,my);
    if(n){ show(n.id, {center:true}); }
    drag = {x:ev.clientX, y:ev.clientY, vx:view.x, vy:view.y, moved:false};
    cv.classList.add("drag"); cv.setPointerCapture(ev.pointerId);
  });
  cv.addEventListener("pointermove", function(ev){
    var r = cv.getBoundingClientRect(), mx = ev.clientX-r.left, my = ev.clientY-r.top;
    if(drag){
      view.x = drag.vx + (ev.clientX - drag.x);
      view.y = drag.vy + (ev.clientY - drag.y);
      draw(); return;
    }
    var n = pick(mx,my), id = n ? n.id : null;
    if(id !== hot){ hot = id; cv.title = n ? n.n : ""; draw(); }
  });
  cv.addEventListener("pointerup", function(){ drag = null; cv.classList.remove("drag"); });
  cv.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var k = ev.deltaY < 0 ? 1.12 : 1/1.12;
    view.s = Math.max(.35, Math.min(4, view.s * k));
    draw();
  }, {passive:false});

  function refresh(){ draw(); table(); }
  ["L1","L2","iso"].forEach(function(id){
    document.getElementById(id).addEventListener("change", refresh);
  });
  rk.addEventListener("change", refresh);
  document.getElementById("q").addEventListener("input", function(ev){
    filt = ev.target.value.trim().toLowerCase();
    var hit = filt ? N.filter(match).sort(function(a,b){ return b.deg-a.deg; })[0] : null;
    if(hit) show(hit.id, {center:true});
    refresh();
  });
  window.addEventListener("resize", fit);
  fit(); table();
  // 開場先站在連結最多的那一檔，讓人一進來就看得到東西
  var first = N.filter(function(n){ return n.t === "個股"; })[0];
  if(first) show(first.id, {nodim:true});
})();
</script>
</body>
</html>
